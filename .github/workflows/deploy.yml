name: Deploy Land Fee MVP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to apis.com.la
        env:
          VPS_HOST: apis.com.la
          VPS_USER: apis
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          TMP_KEY=$(mktemp)
          echo "$VPS_SSH_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"

          # Deploy code to /var/www/html/landfee
          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            cd /var/www/html/landfee
            git pull origin main
            chown -R apis:www-data /var/www/html/landfee
          "

          # Clear OPcache and restart
          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            sudo systemctl restart apache2
          "

          rm -f "$TMP_KEY"
