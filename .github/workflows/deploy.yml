name: Deploy Land Fee MVP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to apis.com.la
        env:
          VPS_HOST: apis.com.la
          VPS_USER: apis
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          TMP_KEY=$(mktemp)
          echo "$VPS_SSH_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"

          # Deploy code to /var/www/html/landtax
          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            mkdir -p /var/www/html/landtax
            cd /var/www/html/landtax
            git config --global --add safe.directory /var/www/html/landtax || true
            if [ ! -d .git ]; then git init && git remote add origin https://github.com/bounthongv/landtitling.git; fi
            git fetch origin
            git reset --hard origin/main
            # Remove untracked files that conflict with repo
            git clean -fd
            # Ensure API symlink exists for /api/v1 access
            ln -sfn ../api /var/www/html/landtax/public/api
          "

          # Clear OPcache and fix ownership. The tree may be owned by www-data
          # (e.g. after a manual copy), which makes a non-sudo chown fail and
          # abort the deploy — so chown through sudo.
          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" "
            sudo chown -R apis:www-data /var/www/html/landtax
            sudo systemctl restart apache2
          "

          rm -f "$TMP_KEY"
